name: (Reusable) Docker compose build then deploy

on:
  workflow_call:
    inputs:
      project:
        description: "Compose project name"
        required: true
        type: string
      compose_file:
        description: "Path of compose file"
        default: "docker-compose.yml"
        required: false
        type: string
      ref:
        description: "Ref to checkout (defaults to the triggering ref)"
        default: ""
        required: false
        type: string
      paths:
        description: "Only deploy if these paths changed (dorny/paths-filter glob, empty = always)"
        default: ""
        required: false
        type: string
      build_args:
        description: "Extra --build-arg flags"
        default: ""
        required: false
        type: string
      up_args:
        description: "Extra docker compose up flags"
        default: ""
        required: false
        type: string

jobs:
  check-changes:
    if: inputs.paths != ''
    runs-on: [self-hosted, builder]
    outputs:
      value: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.source == 'true' }}
    steps:
      - name: Pull repo
        uses: actions/checkout@v4
        with:
          clean: true
          ref: ${{ inputs.ref }}
      - uses: dorny/paths-filter@v3
        id: changes
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            source:
              - '${{ inputs.paths }}'

  compose-deploy:
    needs: check-changes
    if: ${{ !cancelled() && (needs.check-changes.result == 'skipped' || needs.check-changes.outputs.value == 'true') }}
    runs-on: [self-hosted, compose]
    concurrency:
      group: compose-${{ inputs.project }}
      cancel-in-progress: false
    env:
      COMPOSE_PROJECT_NAME: ${{ inputs.project }}
      COMPOSE_FILE: ${{ inputs.compose_file }}
    steps:
      - name: Pull repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          clean: true
          lfs: true
          ref: ${{ inputs.ref }}

      - name: Validate
        run: docker compose config --quiet

      - name: Build
        run: docker compose build --pull ${{ inputs.build_args }}

      - name: Up
        run: docker compose up -d --no-build --remove-orphans --wait --wait-timeout 180 ${{ inputs.up_args }}

      - name: Logs
        if: failure()
        run: docker compose ps -a && docker compose logs --tail 100

      - name: Prune
        if: always()
        run: docker image prune -f
